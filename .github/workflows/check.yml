name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate documentation, standards, tests, and static routes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run repository checks
        run: make check

      - name: Build curated public artifact
        run: python3 scripts/build-public-site.py --source-sha "${GITHUB_SHA}"

      - name: Upload public artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: urai-foundation-public-site
          path: _site
          if-no-files-found: error
          retention-days: 14
