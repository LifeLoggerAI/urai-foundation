name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: foundation-check-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    name: Validate documentation, standards, tests, static routes, and backend types
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run repository checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/foundation-check
          make check 2>&1 | tee /tmp/foundation-check/make-check.log

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install Cloud Functions dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund 2>&1 | tee /tmp/foundation-check/functions-install.log

      - name: Build deployable Cloud Functions
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions run build 2>&1 | tee /tmp/foundation-check/functions-build.log
          test -s functions/lib/index.js

      - name: Verify installed SDK compatibility and dependency audits
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions run typecheck 2>&1 | tee /tmp/foundation-check/functions-typecheck.log
          npm --prefix functions test 2>&1 | tee /tmp/foundation-check/functions-test.log
          npm audit --prefix functions --audit-level=low --json | tee /tmp/foundation-check/audit-all.json
          npm audit --prefix functions --omit=dev --audit-level=low --json | tee /tmp/foundation-check/audit-prod.json
          sha256sum functions/package.json functions/package-lock.json functions/test/sdk-compatibility.test.cjs functions/lib/index.js > /tmp/foundation-check/dependency-source-build-sha256.txt

      - name: Build curated public artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-public-site.py --source-sha "$TARGET_SHA" 2>&1 | tee /tmp/foundation-check/build-public-site.log
          test -s _site/public-build-manifest.json

      - name: Prove artifact and source identity
        shell: bash
        run: |
          set -euo pipefail
          grep -F "$TARGET_SHA" _site/public-build-manifest.json >/dev/null
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git status --porcelain=v1 --untracked-files=all > /tmp/foundation-check/all-source-status.log
          grep -v '^?? _site/' /tmp/foundation-check/all-source-status.log > /tmp/foundation-check/final-source-status.log || true
          test ! -s /tmp/foundation-check/final-source-status.log

      - name: Prepare explicit artifact upload paths
        id: artifact_paths
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/public-artifact-contract.py prepare --source-sha "$TARGET_SHA"

      - name: Upload exact-head allowlisted artifact
        id: public_artifact
        if: always() && steps.artifact_paths.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-foundation-public-site-${{ env.TARGET_SHA }}
          # Explicit, byte-validated files only. The sole admitted hidden file
          # is the builder's .nojekyll marker; no hidden directory is selected.
          path: ${{ steps.artifact_paths.outputs.paths }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Download the actual uploaded artifact
        if: always() && steps.public_artifact.outcome == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.public_artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/downloaded-foundation-public

      - name: Verify downloaded bytes against the original manifest
        if: always() && steps.public_artifact.outcome == 'success'
        shell: bash
        env:
          ORIGINAL_MANIFEST_SHA256: ${{ steps.artifact_paths.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/public-artifact-contract.py verify-download \
            --source-sha "$TARGET_SHA" \
            --manifest-sha256 "$ORIGINAL_MANIFEST_SHA256" \
            --download-root "$RUNNER_TEMP/downloaded-foundation-public" \
            2>&1 | tee /tmp/foundation-check/downloaded-artifact-contract.log

      - name: Retain diagnostics including download verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-foundation-check-diagnostics-${{ env.TARGET_SHA }}
          path: /tmp/foundation-check/**
          if-no-files-found: warn
          retention-days: 90
