name: Documentation validation

on:
  pull_request:
  push:
    branches:
      - main
      - work

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run local checks
        run: make check
