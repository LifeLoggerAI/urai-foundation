<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">URAI Foundation mark</title>
  <desc id="desc">A dark rounded square with a luminous foundation orb and the letters UF.</desc>
  <defs>
    <radialGradient id="orb" cx="36%" cy="28%" r="70%">
      <stop offset="0" stop-color="#fff7d8"/>
      <stop offset="0.38" stop-color="#9ed7ff"/>
      <stop offset="0.72" stop-color="#243d66"/>
      <stop offset="1" stop-color="#0b1020"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17233c"/>
      <stop offset="1" stop-color="#070b15"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <circle cx="256" cy="246" r="154" fill="none" stroke="#d7b56d" stroke-opacity="0.42" stroke-width="10"/>
  <ellipse cx="256" cy="256" rx="186" ry="72" fill="none" stroke="#9ed7ff" stroke-opacity="0.35" stroke-width="9" transform="rotate(-18 256 256)"/>
  <circle cx="256" cy="246" r="94" fill="url(#orb)"/>
  <text x="256" y="401" text-anchor="middle" fill="#f8f4eb" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="8">UF</text>
</svg>
